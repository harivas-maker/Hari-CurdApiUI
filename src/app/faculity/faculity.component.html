

<div class="pdf-container">
  <!-- LEFT DIV (Empty for now) -->
  <div class="left-panel">
    <!-- You can add content here later -->
  </div>

  <!-- RIGHT DIV (PDF Controls + Viewer) -->
  <div class="right-panel">
    <h2>📄 School Info PDF Viewer</h2>
    <!-- PDF Controls -->
    <div class="pdf-controls">
  <button (click)="prevPage()" [disabled]="page <= 1">⬅ Previous</button>

  <span>Page {{ page }} of {{ totalPages }}</span>

  <button (click)="nextPage()" [disabled]="page >= totalPages">Next ➡</button>

  <button (click)="zoomOut()" [disabled]="zoom <= 0.5">➖ Zoom Out</button>

  <button (click)="zoomIn()">➕ Zoom In</button>

  <span style="margin-left: 10px;">Zoom: {{ (zoom * 100) | number:'1.0-0' }}%</span>

  <!-- 🔍 Search Control -->
  <input
    type="text"
    placeholder="Search text"
    [(ngModel)]="searchText"
    class="search-input"
  />
  <button (click)="searchInPdf()">🔍 Search</button>
</div>

      (after-load-complete)="onPdfLoad($event)"
      style="display: block; width: 100%; height: 600px;">
    </pdf-viewer> -->
<pdf-viewer
  *ngIf="pdfSrc"
  [src]="pdfSrc"
  [page]="page"
  [zoom]="zoom"
  [render-text]="true"
  [show-all]="false"
  (after-load-complete)="onPdfLoad($event)"
  (page-rendered)="onPageRendered()"
  style="display: block; width: 100%; height: 600px;">
</pdf-viewer>

    <!-- Loading State -->
    <div *ngIf="!pdfSrc" style="margin-top: 20px;">
      Loading PDF...
    </div>
  </div>
</div>
